<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>沉浸式英语跟读 | 多例句·图片场景·重复模式</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #f0f7ff 0%, #e6ecf3 100%);
            margin: 0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .app-container {
            max-width: 860px;
            width: 100%;
            margin: 0 auto;
            background: rgba(255,255,255,0.92);
            backdrop-filter: blur(2px);
            border-radius: 48px;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.2);
            overflow: hidden;
        }

        .view {
            padding: 24px 22px 32px;
        }

        .hidden {
            display: none;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 1.9rem;
            font-weight: 700;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
            margin: 0;
        }

        .sub {
            color: #5a6e8a;
            font-size: 0.8rem;
        }

        /* 主题卡片 */
        .theme-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
            margin: 20px 0;
        }

        .theme-card {
            background: white;
            border-radius: 28px;
            padding: 16px 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid rgba(60,100,177,0.2);
            box-shadow: 0 4px 8px rgba(0,0,0,0.02);
        }

        .theme-card:hover { transform: translateY(-3px); background: #fff; border-color: #3c64b1; }

        /* 控制栏 */
        .control-bar {
            background: #eef2fa;
            border-radius: 40px;
            padding: 12px 18px;
            margin: 16px 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            gap: 12px;
            align-items: center;
        }

        .ctrl-group {
            display: flex;
            gap: 12px;
            align-items: center;
            background: white;
            padding: 4px 12px;
            border-radius: 40px;
        }

        .ctrl-group label {
            font-weight: 600;
            font-size: 0.8rem;
        }

        select, input[type="number"] {
            background: #f8fafd;
            border: 1px solid #bdc4d0;
            border-radius: 30px;
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .voice-btn {
            background: transparent;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
        }

        .voice-active {
            background: #2a5298;
            color: white;
        }

        /* 单词卡片 - 新增图片右侧布局 */
        .word-card {
            background: white;
            border-radius: 32px;
            padding: 18px;
            margin-bottom: 20px;
            box-shadow: 0 6px 14px rgba(0,0,0,0.05);
            transition: 0.1s;
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
        }

        .word-content {
            flex: 2;
            min-width: 200px;
        }

        .word-image {
            flex-shrink: 0;
            width: 100px;
            height: 100px;
            border-radius: 20px;
            object-fit: cover;
            background: #f0f3f8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            color: #7c8ea0;
            border: 1px solid #e2e8f0;
        }

        .word-image img {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            object-fit: cover;
        }

        .word-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 2px dashed #dce5f0;
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .word-title {
            font-size: 1.8rem;
            font-weight: 800;
            color: #0b2b44;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge {
            background: #e3edfc;
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 40px;
        }

        .meaning {
            font-size: 1rem;
            color: #2c6280;
            margin: 6px 0;
        }

        .phonetic {
            font-family: monospace;
            background: #eef3fc;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 0.75rem;
        }

        .examples-section {
            background: #f9fbfe;
            border-radius: 24px;
            padding: 12px;
            margin: 12px 0;
        }

        .example-item {
            background: white;
            border-left: 5px solid #4caf50;
            padding: 10px 12px;
            margin-bottom: 10px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .example-copy {
            flex: 1;
            min-width: 220px;
        }

        .example-text {
            display: block;
            font-size: 0.9rem;
            color: #1f3b4c;
        }

        .example-translation {
            display: block;
            margin-top: 5px;
            padding: 5px 8px;
            border-radius: 14px;
            background: #fff7d6;
            color: #6d5200;
            font-size: 0.82rem;
        }

        .btn-sm {
            background: #eef2fa;
            border: none;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
        }

        .read-word-btn {
            background: #ffcc4d;
            color: #4a3200;
        }

        .delete-word-btn {
            background: #ffe4e6;
            color: #8a1f1f;
        }

        .speech-control-btn {
            background: #f97316;
            color: white;
        }

        .word-actions {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            flex-wrap: wrap;
        }

        .btn-primary {
            background: #2a5298;
            color: white;
        }

        .video-area {
            margin-top: 12px;
            background: #f1f5f9;
            border-radius: 24px;
            padding: 10px;
        }

        .video-embed {
            width: 100%;
            border-radius: 20px;
            min-height: 180px;
            background: #0002;
        }

        iframe {
            width: 100%;
            border-radius: 16px;
        }

        .add-word-section {
            background: #ffffffcc;
            backdrop-filter: blur(4px);
            border-radius: 28px;
            padding: 16px;
            margin-top: 20px;
        }

        .form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        input, textarea, select {
            flex: 1;
            padding: 10px 14px;
            border-radius: 60px;
            border: 1px solid #cbd5e1;
            background: white;
        }

        textarea {
            border-radius: 20px;
        }

        button {
            background: #2a5298;
            border: none;
            color: white;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 40px;
            cursor: pointer;
        }

        .back-btn {
            background: #6c86a3;
            margin-bottom: 12px;
        }

        .dynamic-example-list {
            background: #eef2fa;
            border-radius: 24px;
            padding: 8px;
            margin-top: 6px;
        }

        .example-input-group input {
            min-width: 180px;
        }

        .batch-input {
            width: 100%;
            min-height: 110px;
            resize: vertical;
            line-height: 1.45;
        }

        .batch-status {
            margin-top: 8px;
            padding: 8px 10px;
            border-radius: 16px;
            background: #fff7d6;
            color: #6d5200;
            font-size: 0.82rem;
        }

        @media (max-width: 550px) {
            .word-card { flex-direction: column; }
            .word-image { width: 100%; height: auto; max-height: 160px; }
            .word-image img { max-height: 160px; }
            .ctrl-group { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>
<div class="app-container" id="app">
    <!-- 主题选择页 -->
    <div id="themeView" class="view">
        <div class="header">
            <h1>🎧 沉浸跟读坊</h1>
            <div class="sub">多例句 · 图片视频 · 智能跟读</div>
        </div>
        <div class="theme-grid" id="themeGrid"></div>
        <div class="add-word-section">
            <div style="font-weight:700;">➕ 创建新单词（支持图片/多例句/视频）</div>
            <div class="form-row">
                <input type="text" id="newWord" placeholder="单词" autocomplete="off">
                <input type="text" id="newMeaning" placeholder="中文释义">
            </div>
            <div class="form-row">
                <input type="text" id="newPhonetic" placeholder="音标 (可选)">
                <select id="newPos"><option>名词</option><option>动词</option><option>形容词</option><option>副词</option><option>介词</option><option>连词</option><option>代词</option><option>短语</option><option>其他</option></select>
            </div>
            <div class="form-row">
                <input type="text" id="newImageUrl" placeholder="图片URL (可选) 直接粘贴图片链接">
                <input type="text" id="newVideoUrl" placeholder="视频链接 (YouTube 或 任意视频URL) 可选">
            </div>
            <div><label>📝 例句列表 (至少一个，可添加多个): </label></div>
            <div id="dynamicExamplesContainer">
                <div class="form-row example-input-group">
                    <input type="text" class="example-input" placeholder="English example: This view is incredible!">
                    <input type="text" class="example-zh-input" placeholder="中文例句翻译">
                    <button type="button" class="removeExampleBtn" style="background:#b91c1c; padding:6px 12px;" disabled>✖</button>
                </div>
            </div>
            <button id="addExampleFieldBtn" style="background:#4b6e8a; margin-bottom:12px;">+ 增加另一个例句</button>
            <button id="submitNewWordBtn">📖 添加到当前主题</button>
            <div class="sub" style="margin-top:8px;">* 默认主题为第一个，点击主题后录入单词会归类到当前激活主题</div>
        </div>
    </div>

    <!-- 单词学习页 -->
    <div id="wordView" class="view hidden">
        <button class="back-btn" id="backToThemeBtn">← 主题列表</button>
        <div class="header">
            <h2 id="currentThemeTitle">主题</h2>
            <div class="sub" id="themeDesc">跟读模式 | 可调重复次数与播放顺序</div>
        </div>
        <!-- 全局控制栏 -->
        <div class="control-bar">
            <div class="ctrl-group">
                <label>🔁 重复次数</label>
                <select id="repeatCount" style="width:90px;">
                    <option value="1">1 次</option>
                    <option value="2">2 次</option>
                    <option value="3" selected>3 次</option>
                    <option value="4">4 次</option>
                    <option value="5">5 次</option>
                </select>
            </div>
            <div class="ctrl-group">
                <label>🎭 播放模式</label>
                <select id="playModeSelect">
                    <option value="word_only">📣 仅单词</option>
                    <option value="examples_only">📚 仅所有例句 (顺序)</option>
                    <option value="word_then_examples" selected>🔊 单词 → 所有例句</option>
                </select>
            </div>
            <div class="ctrl-group">
                <button id="ukVoiceBtn2" class="voice-btn">🇬🇧 英式</button>
                <button id="usVoiceBtn2" class="voice-btn voice-active">🇺🇸 美式</button>
            </div>
            <div class="ctrl-group hidden" id="speechControlGroup">
                <button id="pauseResumeBtn" class="speech-control-btn" type="button">⏸ Pause</button>
                <button id="stopSpeechBtn" class="speech-control-btn" type="button">⏹ Stop</button>
            </div>
        </div>
        <div id="wordsContainer"></div>
        <div class="add-word-section" style="margin-top:12px;">
            <div style="font-weight:600;">✨ 快速添加单词（含图片）</div>
            <div class="form-row">
                <input id="quickWord" placeholder="单词">
                <select id="quickPos" aria-label="词性"><option>名词</option><option>动词</option><option>形容词</option><option>副词</option><option>介词</option><option>连词</option><option>代词</option><option>短语</option><option>其他</option></select>
                <input id="quickMeaning" placeholder="释义">
            </div>
            <div class="form-row"><input id="quickImageUrl" placeholder="图片URL (可选)"></div>
            <div id="quickExamplesArea">
                <div class="form-row example-input-group">
                    <input type="text" id="quickExEn1" placeholder="English example">
                    <input type="text" id="quickExZh1" placeholder="中文例句翻译">
                </div>
            </div>
            <button id="addQuickExampleBtn" style="background:#4b6e8a;">+ 例句</button>
            <button id="quickAddFullBtn" style="margin-left:8px;">➕ 快速添加</button>
            <div style="font-weight:600; margin-top:18px;">📚 批量添加单词</div>
            <textarea id="batchInput" class="batch-input" placeholder="每行一个：word | 词性 | 中文意思 | English example | 中文例句翻译&#10;clever | 形容词 | 聪明的 | The clever boy solved the problem. | 这个聪明的男孩解决了问题。&#10;forest | 名词 | 森林 | The rabbit ran into the forest. | 兔子跑进了森林。"></textarea>
            <button id="batchAddBtn" style="margin-top:8px;">导入</button>
            <div id="batchStatus" class="batch-status hidden"></div>
        </div>
    </div>
</div>

<script>
    // ---------- 初始数据（支持多例句+视频+图片）----------
    let themesData = {
        "travel": {
            name: "✈️ 旅行", desc: "机场/观光/问路",
            words: [
                { word: "destination", meaning: "目的地", phonetic: "/ˌdestɪˈneɪʃn/", pos: "名词", examples: [{ en: "Our final destination is Paris, the city of love.", zh: "我们的最终目的地是巴黎，那座爱之城。" }, { en: "We reached our destination after a long flight.", zh: "经过长途飞行后，我们到达了目的地。" }], videoUrl: "", imageUrl: "images/ig_0dabc073eedb10d4016a093840e5d08194a9c563d2d83085b6.png", spellingHint: "des·ti·na·tion" },
                { word: "itinerary", meaning: "行程", phonetic: "/aɪˈtɪnərəri/", pos: "名词", examples: [{ en: "Can you share the travel itinerary with me?", zh: "你可以把旅行行程分享给我吗？" }, { en: "The itinerary includes a visit to the museum.", zh: "这个行程包括参观博物馆。" }], videoUrl: "", imageUrl: "images/ig_0dabc073eedb10d4016a09387db300819484dd9841d1810d99.png" },
                { word: "boarding pass", meaning: "登机牌", phonetic: "/ˈbɔːrdɪŋ pæs/", pos: "短语", examples: [{ en: "Don't lose your boarding pass before boarding.", zh: "登机前不要弄丢你的登机牌。" }, { en: "Please show your boarding pass at gate 12.", zh: "请在12号登机口出示你的登机牌。" }], videoUrl: "", imageUrl: "images/ig_0dabc073eedb10d4016a0938bf617c819483ee34c6fed4ca6e.png" }
            ]
        },
        "work": {
            name: "💼 职场", desc: "商务/会议",
            words: [
                { word: "deadline", meaning: "截止期限", phonetic: "/ˈdedlaɪn/", pos: "名词", examples: [{ en: "We have to submit the report before the deadline.", zh: "我们必须在截止日期前提交报告。" }, { en: "The deadline is approaching quickly.", zh: "截止日期很快就要到了。" }], videoUrl: "", imageUrl: "images/ig_0dabc073eedb10d4016a0938fdda088194a64b9aa8ec985852.png" },
                { word: "negotiate", meaning: "谈判", phonetic: "/nɪˈɡəʊʃieɪt/", pos: "动词", examples: [{ en: "It's time to negotiate the contract terms.", zh: "现在该谈判合同条款了。" }, { en: "They managed to negotiate a better deal.", zh: "他们成功谈成了更好的交易。" }], videoUrl: "", imageUrl: "images/ig_0dabc073eedb10d4016a09393ecc5481949364c4bb0cd69fae.png" }
            ]
        },
        "daily": {
            name: "🏠 日常", desc: "生活口语",
            words: [
                { word: "groceries", meaning: "杂货", phonetic: "/ˈɡrəʊsəriz/", pos: "名词", examples: [{ en: "I need to pick up some groceries after work.", zh: "我下班后需要买些杂货。" }, { en: "She bought fresh groceries for dinner.", zh: "她为晚餐买了新鲜食材。" }], videoUrl: "", imageUrl: "images/ig_0dabc073eedb10d4016a09396bfcd08194aeb9dc4eb34ef50c.png" },
                { word: "commute", meaning: "通勤", phonetic: "/kəˈmjuːt/", pos: "动词", examples: [{ en: "My daily commute takes about an hour.", zh: "我每天通勤大约需要一小时。" }, { en: "Many people commute by subway.", zh: "很多人乘地铁通勤。" }], videoUrl: "", imageUrl: "images/ig_0dabc073eedb10d4016a0939a720f08194bbb6562bd047b2f7.png" }
            ]
        }
    };

    const defaultWordImages = {
        "destination": "images/ig_0dabc073eedb10d4016a093840e5d08194a9c563d2d83085b6.png",
        "itinerary": "images/ig_0dabc073eedb10d4016a09387db300819484dd9841d1810d99.png",
        "boarding pass": "images/ig_0dabc073eedb10d4016a0938bf617c819483ee34c6fed4ca6e.png",
        "deadline": "images/ig_0dabc073eedb10d4016a0938fdda088194a64b9aa8ec985852.png",
        "negotiate": "images/ig_0dabc073eedb10d4016a09393ecc5481949364c4bb0cd69fae.png",
        "groceries": "images/ig_0dabc073eedb10d4016a09396bfcd08194aeb9dc4eb34ef50c.png",
        "commute": "images/ig_0dabc073eedb10d4016a0939a720f08194bbb6562bd047b2f7.png"
    };

    const posAliases = {
        'n': '名词',
        'n.': '名词',
        'noun': '名词',
        'v': '动词',
        'v.': '动词',
        'verb': '动词',
        'adj': '形容词',
        'adj.': '形容词',
        'adjective': '形容词',
        'adv': '副词',
        'adv.': '副词',
        'adverb': '副词',
        'prep': '介词',
        'prep.': '介词',
        'preposition': '介词',
        'conj': '连词',
        'conj.': '连词',
        'conjunction': '连词',
        'pron': '代词',
        'pron.': '代词',
        'pronoun': '代词',
        'phrase': '短语'
    };
    const knownPartsOfSpeech = new Set([
        '名词',
        '动词',
        '形容词',
        '副词',
        '介词',
        '连词',
        '代词',
        '短语',
        '其他',
        ...Object.keys(posAliases)
    ]);

    normalizeAllThemes();

    let currentThemeKey = "travel";
    let currentVoiceType = "US";
    let repeatCount = 3;
    let playMode = "word_then_examples";
    let speechQueue = [];
    let isSpeaking = false;
    const speechSupported = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
    const pauseResumeAvailable = speechSupported
        && typeof window.speechSynthesis.pause === 'function'
        && typeof window.speechSynthesis.resume === 'function';
    let speechSessionId = 0;
    let speechState = "idle";

    // DOM
    const themeView = document.getElementById('themeView');
    const wordView = document.getElementById('wordView');
    const themeGrid = document.getElementById('themeGrid');
    const wordsContainer = document.getElementById('wordsContainer');
    const currentThemeTitleSpan = document.getElementById('currentThemeTitle');
    const themeDescSpan = document.getElementById('themeDesc');
    const repeatCountInput = document.getElementById('repeatCount');
    const playModeSelect = document.getElementById('playModeSelect');
    const backBtn = document.getElementById('backToThemeBtn');
    const ukBtn = document.getElementById('ukVoiceBtn2');
    const usBtn = document.getElementById('usVoiceBtn2');
    const submitNewWordBtn = document.getElementById('submitNewWordBtn');
    const quickAddFullBtn = document.getElementById('quickAddFullBtn');
    const addExampleFieldBtn = document.getElementById('addExampleFieldBtn');
    const addQuickExampleBtn = document.getElementById('addQuickExampleBtn');
    const speechControlGroup = document.getElementById('speechControlGroup');
    const pauseResumeBtn = document.getElementById('pauseResumeBtn');
    const stopSpeechBtn = document.getElementById('stopSpeechBtn');
    const batchInput = document.getElementById('batchInput');
    const batchAddBtn = document.getElementById('batchAddBtn');
    const batchStatus = document.getElementById('batchStatus');

    function normalizeAllThemes() {
        for(let k in themesData) {
            themesData[k].words = (themesData[k].words || []).map(normalizeWordRecord);
        }
    }

    function normalizeWordRecord(w) {
        const word = (w.word || '').trim();
        const examples = normalizeExamples(w.examples || (w.example ? [w.example] : []), word, w.skipDefaultExample);
        return {
            word,
            meaning: w.meaning || '',
            phonetic: w.phonetic || '',
            pos: normalizePartOfSpeech(w.pos, '单词'),
            examples,
            videoUrl: w.videoUrl || '',
            imageUrl: normalizeImageUrl(w.imageUrl, word),
            spellingHint: w.spellingHint || word.split('').join('·').slice(0,12)
        };
    }

    function normalizePartOfSpeech(pos, fallback = '单词') {
        const raw = (pos || '').trim();
        if(!raw) return fallback;
        return posAliases[raw.toLowerCase()] || raw;
    }

    function looksLikePartOfSpeech(value) {
        const raw = (value || '').trim();
        if(!raw) return false;
        return knownPartsOfSpeech.has(raw) || knownPartsOfSpeech.has(raw.toLowerCase());
    }

    function normalizeImageUrl(imageUrl, word) {
        const raw = (imageUrl || '').trim();
        const defaultImage = defaultWordImages[word.toLowerCase()];
        if(defaultImage && (!raw || raw.startsWith('https://picsum.photos/'))) return defaultImage;
        return raw;
    }

    function normalizeExamples(examples, word, skipDefaultExample = false) {
        const source = Array.isArray(examples) && examples.length
            ? examples
            : (skipDefaultExample ? [] : [{ en: `Example using ${word}.`, zh: '' }]);
        return source.map(ex => normalizeExample(ex, word)).filter(ex => ex.en || ex.zh);
    }

    function normalizeExample(ex, word) {
        if(typeof ex === 'string') {
            const en = ex.trim();
            return { en, zh: getDefaultExampleTranslation(en) };
        }
        const en = (ex.en || ex.text || ex.example || '').trim();
        const zh = (ex.zh || ex.cn || ex.translation || getDefaultExampleTranslation(en)).trim();
        if(ex.allowEmpty) return { en, zh, allowEmpty: true };
        return { en: en || `Example using ${word}.`, zh };
    }

    function sanitizeRepeatCount(value = repeatCountInput.value) {
        const raw = String(value || '').trim();
        const count = /^[1-5]$/.test(raw) ? Number(raw) : 3;
        repeatCountInput.value = String(count);
        return count;
    }

    function getDefaultExampleTranslation(en) {
        const translations = {
            "Our final destination is Paris, the city of love.": "我们的最终目的地是巴黎，那座爱之城。",
            "We reached our destination after a long flight.": "经过长途飞行后，我们到达了目的地。",
            "Can you share the travel itinerary with me?": "你可以把旅行行程分享给我吗？",
            "The itinerary includes a visit to the museum.": "这个行程包括参观博物馆。",
            "Don't lose your boarding pass before boarding.": "登机前不要弄丢你的登机牌。",
            "Please show your boarding pass at gate 12.": "请在12号登机口出示你的登机牌。",
            "We have to submit the report before the deadline.": "我们必须在截止日期前提交报告。",
            "The deadline is approaching quickly.": "截止日期很快就要到了。",
            "It's time to negotiate the contract terms.": "现在该谈判合同条款了。",
            "They managed to negotiate a better deal.": "他们成功谈成了更好的交易。",
            "I need to pick up some groceries after work.": "我下班后需要买些杂货。",
            "She bought fresh groceries for dinner.": "她为晚餐买了新鲜食材。",
            "My daily commute takes about an hour.": "我每天通勤大约需要一小时。",
            "Many people commute by subway.": "很多人乘地铁通勤。"
        };
        return translations[en] || '';
    }

    function getExampleEnglish(ex) {
        return normalizeExample(ex, '').en;
    }

    function getExampleChinese(ex) {
        return normalizeExample(ex, '').zh;
    }

    function saveToLocal() { localStorage.setItem('multiex_themes_img', JSON.stringify(themesData)); }
    function loadLocal() {
        let data = localStorage.getItem('multiex_themes_img');
        if(data) {
            try {
                let parsed = JSON.parse(data);
                for(let k in parsed) themesData[k] = parsed[k];
                normalizeAllThemes();
            } catch(e) {}
        }
    }

    // 发音核心
    function setSpeechState(state) {
        speechState = state;
        isSpeaking = state === "playing" || state === "paused";
        updateSpeechControls();
    }

    function updateSpeechControls() {
        if(!speechSupported) return;
        const active = speechState === "playing" || speechState === "paused";
        speechControlGroup.classList.toggle('hidden', !active);
        if(!active) return;
        if(pauseResumeAvailable) {
            pauseResumeBtn.textContent = speechState === "paused" ? "▶ Resume" : "⏸ Pause";
            stopSpeechBtn.classList.remove('hidden');
        } else {
            pauseResumeBtn.textContent = "⏹ Stop";
            stopSpeechBtn.classList.add('hidden');
        }
    }

    function stopSpeech() {
        speechSessionId++;
        if(speechSupported) {
            window.speechSynthesis.cancel();
        }
        setSpeechState("idle");
    }

    function togglePauseResumeSpeech() {
        if(!speechSupported) return;
        if(!pauseResumeAvailable) {
            stopSpeech();
            return;
        }
        if(speechState === "playing") {
            window.speechSynthesis.pause();
            setSpeechState("paused");
        } else if(speechState === "paused") {
            window.speechSynthesis.resume();
            setSpeechState("playing");
        }
    }

    function waitBetweenSpeech(ms, sessionId) {
        return new Promise(resolve => {
            setTimeout(() => resolve(sessionId === speechSessionId), ms);
        });
    }

    function speakTextOnce(text, sessionId) {
        return new Promise((resolve) => {
            if(!speechSupported || sessionId !== speechSessionId) { resolve(false); return; }
            const cleanText = (text || '').trim();
            if(!cleanText) { resolve(true); return; }
            let utterance = new SpeechSynthesisUtterance(cleanText);
            utterance.lang = currentVoiceType === "US" ? "en-US" : "en-GB";
            utterance.rate = 0.9;
            utterance.onstart = () => {
                if(sessionId === speechSessionId) setSpeechState("playing");
            };
            utterance.onend = () => { resolve(sessionId === speechSessionId); };
            utterance.onerror = () => { resolve(false); };
            window.speechSynthesis.speak(utterance);
        });
    }

    async function playSpeechTexts(texts, gapMs = 200) {
        stopSpeech();
        const queue = texts.map(text => (text || '').trim()).filter(Boolean);
        if(!speechSupported || !queue.length) return;
        const sessionId = ++speechSessionId;
        speechQueue = queue;
        setSpeechState("playing");
        for(let text of queue) {
            if(sessionId !== speechSessionId) break;
            const finished = await speakTextOnce(text, sessionId);
            if(!finished || sessionId !== speechSessionId) break;
            const stillCurrent = await waitBetweenSpeech(gapMs, sessionId);
            if(!stillCurrent) break;
        }
        if(sessionId === speechSessionId) {
            speechQueue = [];
            setSpeechState("idle");
        }
    }

    function speakText(text) {
        return playSpeechTexts([text], 200);
    }

    async function playWordAndExamples(wordObj, mode, repeats) {
        let texts = [];
        if(mode === "word_only") {
            for(let i=0; i<repeats; i++) texts.push(wordObj.word);
        }
        else if(mode === "examples_only") {
            for(let r=0; r<repeats; r++) {
                for(let ex of wordObj.examples) texts.push(getExampleEnglish(ex));
            }
        }
        else if(mode === "word_then_examples") {
            for(let cycle=0; cycle<repeats; cycle++) {
                texts.push(wordObj.word);
                for(let ex of wordObj.examples) texts.push(getExampleEnglish(ex));
            }
        }
        await playSpeechTexts(texts, 300);
    }

    async function playSingleWord(word, repeats) {
        await playSpeechTexts(Array(repeats).fill(word), 200);
    }
    async function playSingleExample(exampleText, repeats) {
        await playSpeechTexts(Array(repeats).fill(exampleText), 200);
    }

    // 渲染单词列表 (带图片右侧)
    function renderWords() {
        const theme = themesData[currentThemeKey];
        if(!theme) return;
        repeatCount = sanitizeRepeatCount();
        currentThemeTitleSpan.innerText = theme.name;
        themeDescSpan.innerText = theme.desc + ` | 重复${repeatCount}次 · 模式:${playModeSelect.options[playModeSelect.selectedIndex]?.text}`;
        if(!theme.words.length) {
            wordsContainer.innerHTML = `<div class="empty-words">📭 暂无单词，快添加第一个吧~</div>`;
            return;
        }
        wordsContainer.innerHTML = "";
        theme.words.forEach((wordObj, idx) => {
            const card = document.createElement('div');
            card.className = 'word-card';
            // 图片区域
            let imageHtml = `<div class="word-image">`;
            if(wordObj.imageUrl && wordObj.imageUrl.trim() !== "") {
                imageHtml += `<img src="${escapeHtml(wordObj.imageUrl)}" alt="${escapeHtml(wordObj.word)}" loading="lazy" onerror="this.onerror=null;this.src='https://via.placeholder.com/100x100?text=No+Image';">`;
            } else {
                imageHtml += `<div style="display:flex; align-items:center; justify-content:center; width:100%; height:100%; background:#eef2fa; border-radius:20px;">🖼️ 无图</div>`;
            }
            imageHtml += `</div>`;
            // 例句HTML
            let examplesHtml = `<div class="examples-section"><strong>📌 场景例句 (${wordObj.examples.length})：</strong>`;
            wordObj.examples.forEach((ex, exIdx) => {
                const exEnglish = getExampleEnglish(ex);
                const exChinese = getExampleChinese(ex);
                const exampleReadButtonHtml = speechSupported && exEnglish
                    ? `<button class="btn-sm play-example-btn" data-word-idx="${idx}" data-ex-idx="${exIdx}" type="button">🔊 跟读此例句</button>`
                    : '';
                examplesHtml += `
                    <div class="example-item">
                        <div class="example-copy">
                            ${exEnglish ? `<span class="example-text">💬 ${escapeHtml(exEnglish)}</span>` : ''}
                            ${exChinese ? `<span class="example-translation">中文：${escapeHtml(exChinese)}</span>` : ''}
                        </div>
                        ${exampleReadButtonHtml}
                    </div>
                `;
            });
            examplesHtml += `</div>`;
            // 视频区域
            let videoHtml = '';
            if(wordObj.videoUrl && wordObj.videoUrl.trim() !== "") {
                let embedUrl = wordObj.videoUrl;
                if(embedUrl.includes("youtube.com/watch?v=")) {
                    let vid = embedUrl.split('v=')[1]?.split('&')[0];
                    if(vid) embedUrl = `https://www.youtube.com/embed/${vid}`;
                } else if(embedUrl.includes("youtu.be/")) {
                    let vid = embedUrl.split('/').pop();
                    embedUrl = `https://www.youtube.com/embed/${vid}`;
                }
                videoHtml = `<div class="video-area"><strong>🎬 视频场景：</strong><div class="video-embed"><iframe src="${embedUrl}" frameborder="0" allowfullscreen style="width:100%; height:180px;"></iframe></div></div>`;
            }
            const contentDiv = document.createElement('div');
            contentDiv.className = 'word-content';
            const readButtonHtml = speechSupported
                ? `<button class="btn-sm read-word-btn" data-word-idx="${idx}" type="button">🔊 Read</button>`
                : '';
            const smartPlayButtonHtml = speechSupported
                ? `<button class="btn-sm smart-play-btn" data-word-idx="${idx}" type="button">⚡ 智能跟读 (按当前模式+重复)</button>`
                : '';
            const deleteButtonHtml = `<button class="btn-sm delete-word-btn" data-word-idx="${idx}" type="button">🗑 Delete</button>`;
            contentDiv.innerHTML = `
                <div class="word-header">
                    <div class="word-title">${escapeHtml(wordObj.word)} <span class="badge">${wordObj.pos || '单词'}</span></div>
                    ${readButtonHtml}
                </div>
                <div class="meaning">📖 ${escapeHtml(wordObj.meaning)} ${wordObj.phonetic ? `<span class="phonetic">${escapeHtml(wordObj.phonetic)}</span>` : ''}</div>
                <div class="spelling-hint" style="font-size:0.7rem; color:#6c8eae;">🔡 自然拼读: ${wordObj.spellingHint || wordObj.word}</div>
                ${examplesHtml}
                ${videoHtml}
                <div class="word-actions">
                    ${smartPlayButtonHtml}
                    ${deleteButtonHtml}
                </div>
            `;
            card.appendChild(contentDiv);
            card.insertAdjacentHTML('beforeend', imageHtml);
            wordsContainer.appendChild(card);
        });
        // 绑定按钮
        document.querySelectorAll('.read-word-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                let idx = parseInt(btn.dataset.wordIdx);
                let w = themesData[currentThemeKey].words[idx];
                await speakText(w.word);
            });
        });
        document.querySelectorAll('.play-example-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                let wordIdx = parseInt(btn.dataset.wordIdx);
                let exIdx = parseInt(btn.dataset.exIdx);
                let exText = themesData[currentThemeKey].words[wordIdx].examples[exIdx];
                repeatCount = sanitizeRepeatCount();
                await playSingleExample(getExampleEnglish(exText), repeatCount);
            });
        });
        document.querySelectorAll('.smart-play-btn').forEach(btn => {
            btn.addEventListener('click', async (e) => {
                let idx = parseInt(btn.dataset.wordIdx);
                let wordObj = themesData[currentThemeKey].words[idx];
                let mode = playModeSelect.value;
                repeatCount = sanitizeRepeatCount();
                await playWordAndExamples(wordObj, mode, repeatCount);
            });
        });
        document.querySelectorAll('.delete-word-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                let idx = parseInt(btn.dataset.wordIdx);
                deleteWord(idx);
            });
        });
    }

    // 主题列表渲染
    function renderThemeSelection() {
        themeGrid.innerHTML = '';
        for(let [key, theme] of Object.entries(themesData)) {
            let card = document.createElement('div');
            card.className = 'theme-card';
            card.innerHTML = `<h3>${theme.name}</h3><p>${theme.desc}</p><small>📖 ${theme.words.length}词 | 图片/例句</small>`;
            card.addEventListener('click', () => {
                currentThemeKey = key;
                renderWords();
                showWordView();
            });
            themeGrid.appendChild(card);
        }
    }

    // 添加单词
    function addWordToCurrentTheme(wordObj) {
        let theme = themesData[currentThemeKey];
        if(!theme) theme = themesData[Object.keys(themesData)[0]];
        theme.words.push(normalizeWordRecord(wordObj));
        saveToLocal();
        if(wordView.classList.contains('hidden')) renderThemeSelection();
        else renderWords();
    }

    function addWordsToCurrentTheme(wordObjs) {
        let theme = themesData[currentThemeKey];
        if(!theme) theme = themesData[Object.keys(themesData)[0]];
        wordObjs.forEach(wordObj => theme.words.push(normalizeWordRecord(wordObj)));
        saveToLocal();
        if(wordView.classList.contains('hidden')) renderThemeSelection();
        else renderWords();
    }

    function deleteWord(idx) {
        let theme = themesData[currentThemeKey];
        if(!theme || !theme.words[idx]) return;
        let word = theme.words[idx].word;
        if(!confirm(`删除 "${word}" 吗？`)) return;
        stopSpeech();
        theme.words.splice(idx, 1);
        saveToLocal();
        renderWords();
        renderThemeSelection();
    }

    // 表单收集多例句
    function collectFormExamples(word) {
        let examples = [];
        document.querySelectorAll('#dynamicExamplesContainer .example-input-group').forEach(row => {
            const en = row.querySelector('.example-input')?.value.trim();
            const zh = row.querySelector('.example-zh-input')?.value.trim();
            if(en || zh) examples.push({ en: en || `Example using ${word}.`, zh: zh || '' });
        });
        if(examples.length === 0) examples.push({ en: `Example using ${word}.`, zh: '' });
        return examples;
    }

    function resetDynamicForm() {
        let container = document.getElementById('dynamicExamplesContainer');
        container.innerHTML = '';
        let div = document.createElement('div');
        div.className = 'form-row example-input-group';
        div.innerHTML = `<input type="text" class="example-input" placeholder="English example"><input type="text" class="example-zh-input" placeholder="中文例句翻译"><button type="button" class="removeExampleBtn" style="background:#b91c1c; padding:6px 12px;" disabled>✖</button>`;
        container.appendChild(div);
    }

    function addExtraExampleField(containerId = 'dynamicExamplesContainer') {
        let container = document.getElementById(containerId);
        let div = document.createElement('div');
        div.className = 'form-row example-input-group';
        div.innerHTML = `<input type="text" class="example-input" placeholder="English example"><input type="text" class="example-zh-input" placeholder="中文例句翻译"><button type="button" class="removeExampleBtn" style="background:#b91c1c; padding:6px 12px;">✖</button>`;
        let removeBtn = div.querySelector('.removeExampleBtn');
        removeBtn.addEventListener('click', () => { div.remove(); });
        container.appendChild(div);
    }

    let quickExampleCount = 1;
    function refreshQuickExamples() {
        let area = document.getElementById('quickExamplesArea');
        area.innerHTML = '';
        for(let i=1; i<=quickExampleCount; i++) {
            let row = document.createElement('div');
            row.className = 'form-row example-input-group';
            row.innerHTML = `<input type="text" id="quickExEn${i}" placeholder="English example ${i}"><input type="text" id="quickExZh${i}" placeholder="中文例句翻译 ${i}">`;
            area.appendChild(row);
        }
    }

    function parseBatchInput(text) {
        const words = [];
        const invalidLines = [];
        const duplicateWords = [];
        const theme = themesData[currentThemeKey];
        const seenWords = new Set((theme?.words || []).map(item => (item.word || '').trim().toLowerCase()));

        text.split(/\r?\n/).forEach((line, index) => {
            const trimmed = line.trim();
            if(!trimmed) return;
            const parts = trimmed.split('|').map(part => part.trim());
            if(parts.length < 2) {
                invalidLines.push(index + 1);
                return;
            }
            const hasExplicitPos = parts.length >= 3 && looksLikePartOfSpeech(parts[1]);
            const word = parts[0] || '';
            const pos = hasExplicitPos ? normalizePartOfSpeech(parts[1], '批量') : '批量';
            const meaning = hasExplicitPos ? (parts[2] || '') : (parts[1] || '');
            const exampleEn = hasExplicitPos ? (parts[3] || '') : (parts[2] || '');
            const exampleZh = (hasExplicitPos ? parts.slice(4) : parts.slice(3)).join(' | ').trim();
            if(!word || !meaning) {
                invalidLines.push(index + 1);
                return;
            }

            const wordKey = word.toLowerCase();
            if(seenWords.has(wordKey)) {
                duplicateWords.push(word);
                return;
            }
            seenWords.add(wordKey);
            words.push({
                word,
                meaning,
                phonetic: '',
                pos,
                examples: (exampleEn || exampleZh) ? [{ en: exampleEn, zh: exampleZh, allowEmpty: true }] : [],
                skipDefaultExample: !exampleEn && !exampleZh,
                videoUrl: '',
                imageUrl: ''
            });
        });
        return { words, invalidLines, duplicateWords };
    }

    function showBatchStatus(result) {
        batchStatus.classList.remove('hidden');
        if(!batchInput.value.trim() && !result.words.length && !result.invalidLines.length && !result.duplicateWords.length) {
            batchStatus.textContent = '先粘贴几行单词，再点击批量添加。';
            return;
        }
        let message = `已添加 ${result.words.length} 个单词。跳过 ${result.invalidLines.length} 行格式不完整。跳过 ${result.duplicateWords.length} 个重复单词。`;
        if(result.invalidLines.length) {
            message += ` 无效行：${result.invalidLines.join(', ')}。`;
        }
        if(result.duplicateWords.length) {
            message += ` 重复：${result.duplicateWords.join(', ')}。`;
        }
        batchStatus.textContent = message;
    }

    function bindEvents() {
        repeatCountInput.addEventListener('change', () => { repeatCount = sanitizeRepeatCount(); renderWords(); });
        playModeSelect.addEventListener('change', () => { renderWords(); });
        ukBtn.addEventListener('click', () => { currentVoiceType = "UK"; ukBtn.classList.add('voice-active'); usBtn.classList.remove('voice-active'); });
        usBtn.addEventListener('click', () => { currentVoiceType = "US"; usBtn.classList.add('voice-active'); ukBtn.classList.remove('voice-active'); });
        backBtn.addEventListener('click', () => { themeView.classList.remove('hidden'); wordView.classList.add('hidden'); renderThemeSelection(); });
        pauseResumeBtn.addEventListener('click', togglePauseResumeSpeech);
        stopSpeechBtn.addEventListener('click', stopSpeech);

        submitNewWordBtn.addEventListener('click', () => {
            let word = document.getElementById('newWord').value.trim();
            let meaning = document.getElementById('newMeaning').value.trim();
            if(!word || !meaning) { alert("单词和释义不能空"); return; }
            let phonetic = document.getElementById('newPhonetic').value;
            let pos = document.getElementById('newPos').value;
            let videoUrl = document.getElementById('newVideoUrl').value;
            let imageUrl = document.getElementById('newImageUrl').value;
            let examples = collectFormExamples(word);
            addWordToCurrentTheme({ word, meaning, phonetic, pos, examples, videoUrl, imageUrl });
            alert(`✅ 已添加 "${word}" 至 ${themesData[currentThemeKey].name}`);
            document.getElementById('newWord').value = '';
            document.getElementById('newMeaning').value = '';
            document.getElementById('newPhonetic').value = '';
            document.getElementById('newVideoUrl').value = '';
            document.getElementById('newImageUrl').value = '';
            resetDynamicForm();
        });
        addExampleFieldBtn.addEventListener('click', () => { addExtraExampleField('dynamicExamplesContainer'); });

        quickAddFullBtn.addEventListener('click', () => {
            let word = document.getElementById('quickWord').value.trim();
            let meaning = document.getElementById('quickMeaning').value.trim();
            let pos = normalizePartOfSpeech(document.getElementById('quickPos').value, '单词');
            let imageUrl = document.getElementById('quickImageUrl').value.trim();
            if(!word || !meaning) { alert("请填写单词和释义"); return; }
            let examples = [];
            for(let i=1; i<=quickExampleCount; i++) {
                let enVal = document.getElementById(`quickExEn${i}`)?.value.trim();
                let zhVal = document.getElementById(`quickExZh${i}`)?.value.trim();
                if(enVal || zhVal) examples.push({ en: enVal || `Example using ${word}.`, zh: zhVal || '' });
            }
            if(examples.length === 0) examples.push({ en: `Example using ${word}.`, zh: '' });
            addWordToCurrentTheme({ word, meaning, phonetic: "", pos, examples, videoUrl: "", imageUrl });
            document.getElementById('quickWord').value = '';
            document.getElementById('quickMeaning').value = '';
            document.getElementById('quickPos').value = '名词';
            document.getElementById('quickImageUrl').value = '';
            quickExampleCount = 1;
            refreshQuickExamples();
            renderWords();
        });
        addQuickExampleBtn.addEventListener('click', () => {
            quickExampleCount++;
            refreshQuickExamples();
        });
        batchAddBtn.addEventListener('click', () => {
            const result = parseBatchInput(batchInput.value);
            if(result.words.length) {
                addWordsToCurrentTheme(result.words);
                batchInput.value = '';
            }
            showBatchStatus(result);
        });
    }

    function showWordView() { themeView.classList.add('hidden'); wordView.classList.remove('hidden'); renderWords(); }
    function showThemeView() { wordView.classList.add('hidden'); themeView.classList.remove('hidden'); renderThemeSelection(); }

    function escapeHtml(s) { if(!s) return ''; return s.replace(/[&<>]/g, function(m){ return {'&':'&amp;','<':'&lt;','>':'&gt;'}[m];}); }

    // 启动
    loadLocal();
    renderThemeSelection();
    bindEvents();
    resetDynamicForm();
    refreshQuickExamples();
    showThemeView();
</script>
